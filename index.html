<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronologia Storica con Approfondimenti</title>
<style>
:root{color-scheme:dark;--bg:#0a1020;--text:#eef4ff;--muted:#b8c7e1;--green:#7cb342;--purple:#ab47bc;--brown:#8d6e63;--blue:#42a5f5;--red:#ef5350}
*{box-sizing:border-box}
html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; font: 13px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); display: flex; flex-direction: column; }

header{padding:10px 16px;background:#10192d;border-bottom:1px solid #35476a; flex-shrink: 0; display:flex; justify-content:space-between; align-items:center;}
h1{font-size:18px;margin:0;color:#fff}

main{padding:10px; width:100%; flex: 1; display: flex; flex-direction: column; overflow: hidden;}

.timeline-box{border:1px solid #30415f;border-radius:8px;background:#0e1728; flex: 1; display: flex; flex-direction: column; min-height: 0;}
.timeline-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#182744;border-bottom:1px solid #2d3b59;font-size:11px; flex-shrink: 0;}
.scroll-controls{display:flex;gap:4px}
.scroll-btn{cursor:pointer;padding:3px 10px;font-size:11px;border:1px solid #354462;border-radius:4px;background:#151f34;color:var(--text);}
.scroll-btn:hover{background:#233352}

.scroll{overflow-x:auto;overflow-y:auto;flex:1;scrollbar-color:#607ba7 #182238;scroll-behavior:smooth; position: relative;}
.board{position:relative;padding:0 20px 20px; min-height: 100%;}
.axis{height:30px;position:sticky;top:0;z-index:8;background:#0e1728;border-bottom:1px solid #526482;}
.tick{position:absolute;bottom:0;height:8px;border-left:1px solid #526482;padding-left:3px;font-size:10px;color:#c0d0eb}
.tick span{position:absolute;bottom:8px;left:2px;font-weight:700;}

.event-area{position:relative;min-height:550px;background:repeating-linear-gradient(90deg,transparent 0,transparent 499px,#ffffff05 500px)}
.event-card{position:absolute;width:220px;padding:6px 8px;border:1px solid #4a5f80;border-left:4px solid var(--accent);border-radius:5px;background:#131e32;color:#f2f6ff;cursor:pointer;line-height:1.2; font-size: 11px; transition: filter .15s, border-color .15s;}
.event-card:hover{border-color:#fff;filter:brightness(1.15);z-index:5}
.event-card .date{display:block;font-size:10px;font-weight:800;color:#c3d7f7;margin-bottom:2px}
.event-card .event-title{display:block;font-size:11px;font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

/* Finestra modale (Popup di approfondimento) */
.overlay{position:fixed;inset:0;background:#020612d9;display:none;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{width:min(500px,100%);max-height:85vh;overflow:auto;background:linear-gradient(145deg,#1b2942,#121b2e);border:1px solid #405578;border-radius:10px;padding:16px;box-shadow:0 20px 60px #0008}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.modal h3{margin:4px 0 10px;font-size:17px;line-height:1.2;color:#fff}
.modal p{color:#d0daed; font-size: 12px; line-height: 1.5; margin-bottom: 0;}
.close{font-size:12px;padding:3px 7px;border:1px solid #354462;border-radius:5px;background:#151f34;color:var(--text);cursor:pointer}
.modal-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9fb3d6;font-weight:800}
</style></head><body>

<header><h1>Cronologia Storica (1517 - 1648)</h1></header>
<main>
<div class="timeline-box">
  <div class="timeline-top">
    <span>Clicca su un elemento per visualizzare l'approfondimento dettagliato</span>
    <div class="scroll-controls">
      <button class="scroll-btn" id="scrollLeft">◀ Sinistra</button>
      <button class="scroll-btn" id="scrollRight">Destra ▶</button>
    </div>
  </div>
  <div class="scroll" id="scroll">
    <div class="board" id="board">
      <div class="axis" id="axis"></div>
      <div class="event-area" id="eventArea"></div>
    </div>
  </div>
</div>
</main>

<div id="overlay" class="overlay" role="dialog">
  <article class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-label" id="modalDate"></div>
        <h3 id="modalTitle"></h3>
      </div>
      <button class="close" id="close">✕</button>
    </div>
    <p id="modalBody"></p>
  </article>
</div>

<script>
// Dati completi di approfondimenti descrittivi
const events = [
  [1517, 1521, "Riforma luterana", "green", "Periodo di profonda trasformazione religiosa avviato dalle contestazioni di Martin Lutero, che portò alla spaccatura della cristianità occidentale e alla nascita delle Chiese protestanti."],
  [1517, 1517, "1517-10-31 Martin Lutero affigge le 95 tesi", "green", "Il monaco agostiniano Martin Lutero affigge le 95 tesi sulla porta della cattedrale di Wittenberg, criticando aspramente la pratica delle indulgenze e dando inizio alla Riforma protestante."],
  [1519, 1556, "Impero di Carlo V", "green", "Il regno di Carlo d'Asburgo, sovrano di un impero 'sulle cui terre non tramontava mai il sole', impegnato a gestire i conflitti religiosi nell'Impero e le guerre contro la Francia e l'Impero Ottomano."],
  [1555, 1555, "Pace di Augusta", "green", "Trattato storico che sancì il principio del 'cuius regio, eius religio', permettendo ai principi tedeschi di scegliere tra cattolicesimo e luteranesimo."],
  [1555, 1618, "Epoca della confessionalizzazione e tensioni nell'Impero", "green", "Fase storica caratterizzata dal irrigidimento delle identità confessionali (cattolica, luterana e calvinista) e dal progressivo accumularsi di tensioni politiche che sfoceranno nella Guerra dei Trent'anni."],
  [1618, 1648, "Guerra dei Trent'anni", "green", "Uno dei conflitti più devastanti della storia europea, nato da motivazioni religiose e politiche all'interno del Sacro Romano Impero e trasformatosi in una lotta per l'egemonia continentale."],
  [1648, 1648, "Pace di Vestfalia", "green", "Insieme di trattati che posero fine alla Guerra dei Trent'anni, ridefinendo gli equilibri geopolitici europei e sancendo il principio della sovranità statale."],

  [1545, 1563, "Concilio di Trento e Controriforma", "purple", "Il concilio ecumenico della Chiesa cattolica convocato per riaffermare i dogmi tradizionali, correggere gli abusi interni e dare avvio alla Controriforma."],

  [1556, 1598, "Regno di Filippo II", "brown", "Il regno del re di Spagna Filippo II, difensore del cattolicesimo controriformista, impegnato nella gestione di un impero globale e nei conflitti contro i Paesi Bassi e l'Inghilterra."],
  [1566, 1581, "Rivolta dei Paesi Bassi", "brown", "La ribellione delle province settentrionali dei Paesi Bassi contro il dominio spagnolo di Filippo II, guidata da Guglielmo d'Orange e culminata nella nascita della repubblica indipendente."],
  [1571, 1571, "1571-10-07 Battaglia di Lepanto", "brown", "Scontro navale in cui la flotta della Lega Santa (promossa dal Papa, dalla Spagna e da Venezia) inflisse una dura sconfitta all'impero ottomano nel Mediterraneo."],

  [1534, 1534, "Atto di Supremazia di Enrico VIII", "blue", "Legge approvata dal Parlamento inglese che proclamava il re Enrico VIII capo supremo della Chiesa d'Inghilterra, sancendo lo scisma da Roma."],
  [1534, 1558, "Fase della Riforma e regno dei Tudor", "blue", "Periodo di transizione religiosa e consolidamento del potere della dinastia Tudor in Inghilterra attraverso riforme istituzionali e scismi."],
  [1558, 1603, "Epoca elisabettiana", "blue", "L'età d'oro del regno di Elisabetta I d'Inghilterra, caratterizzata da stabilità interna, fioritura culturale (teatro elisabettiano) e affermazione marittima."],
  [1588, 1588, "Sconfitta dell'Invincibile Armata", "blue", "Il fallimento della gigantesca spedizione navale inviata da Filippo II di Spagna per invadere l'Inghilterra, decimata dalla flotta inglese e dalle tempeste."],

  [1562, 1598, "Guerre di religione in Francia", "red", "Lunga e sanguinosa serie di conflitti civili tra la maggioranza cattolica e la minoranza calvinista (ugonotti) in Francia."],
  [1572, 1572, "Strage di san Bartolomeo", "red", "Il massacro di migliaia di ugonotti perpetrato a Parigi e in tutta la Francia nella notte tra il 23 e il 24 agosto 1572, apice delle guerre di religione."],
  [1598, 1598, "Editto di Nantes", "red", "Decreto emanato da Enrico IV che pose fine alle guerre di religione in Francia, garantendo agli ugonotti libertà di culto e diritti civili limitati."],
  [1598, 1610, "Regno di Enrico IV", "red", "Il governo di Enrico IV di Borbone, volto alla pacificazione interna della Francia, alla ripresa economica e al rafforzamento dell'autorità regia."],
  [1610, 1624, "Regno di Maria de' Medici e successivamente di Luigi XIII", "red", "Periodo di reggenza e di transizione politica caratterizzato da tensioni nobiliari e dalla gestione del potere prima della svolta assolutistica."],
  [1624, 1642, "Governo di Richelieu e assolutismo", "red", "L'era in cui il cardinale Richelieu diresse la politica francese, riducendo il potere degli ugonotti, sottomettendo la grande nobiltà e ponendo le basi dell'assolutismo."]
];

const colors = {
  green: "var(--green)",
  purple: "var(--purple)",
  brown: "var(--brown)",
  blue: "var(--blue)",
  red: "var(--red)"
};

const minYear = 1510;
const maxYear = 1660;
const scale = 25;

const board = document.getElementById('board');
const axis = document.getElementById('axis');
const eventArea = document.getElementById('eventArea');
const scrollContainer = document.getElementById('scroll');
const overlay = document.getElementById('overlay');

function openModal(e) {
  document.getElementById('modalDate').textContent = e[0] === e[1] ? `${e[0]}` : `${e[0]} – ${e[1]}`;
  document.getElementById('modalTitle').textContent = e[2];
  document.getElementById('modalBody').textContent = e[4];
  overlay.classList.add('open');
}

function render() {
  const boardWidth = (maxYear - minYear) * scale + 300;
  board.style.width = boardWidth + 'px';

  for(let y = minYear; y <= maxYear; y += 10) {
    const t = document.createElement('div');
    t.className = 'tick';
    t.style.left = ((y - minYear) * scale) + 'px';
    t.innerHTML = `<span>${y}</span>`;
    axis.append(t);
  }

  const cardW = 220;
  const cardH = 50;
  const trackEnd = [];

  events.sort((a, b) => a[0] - b[0] || a[1] - b[1]).forEach(e => {
    const x = (e[0] - minYear) * scale;
    let track = 0;

    while (track < trackEnd.length && trackEnd[track] > x - 10) {
      track++;
    }
    if (track === trackEnd.length) trackEnd.push(0);
    trackEnd[track] = x + cardW;

    const el = document.createElement('div');
    el.className = 'event-card';
    el.style.left = x + 'px';
    el.style.top = (10 + track * cardH) + 'px';
    el.style.setProperty('--accent', colors[e[3]]);
    
    const dateText = e[0] === e[1] ? `${e[0]}` : `${e[0]} / ${e[1]}`;
    el.innerHTML = `<span class="date">${dateText}</span><span class="event-title">${e[2]}</span>`;
    
    el.addEventListener('click', () => openModal(e));
    eventArea.append(el);
  });
  
  eventArea.style.height = (trackEnd.length * cardH + 40) + 'px';
}

document.getElementById('scrollLeft').addEventListener('click', () => scrollContainer.scrollBy({ left: -300, behavior: 'smooth' }));
document.getElementById('scrollRight').addEventListener('click', () => scrollContainer.scrollBy({ left: 300, behavior: 'smooth' }));

document.getElementById('close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if(e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') overlay.classList.remove('open'); });

render();
</script></body></html>
