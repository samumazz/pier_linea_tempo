<title>Cronologia Storica con Approfondimenti</title>
<style>
:root{color-scheme:dark;--bg:#0a1020;--text:#eef4ff;--muted:#b8c7e1;--green:#7cb342;--purple:#ab47bc;--brown:#8d6e63;--blue:#42a5f5;--red:#ef5350}
*{box-sizing:border-box}
html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; font: 13px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); display: flex; flex-direction: column; }

header{padding:10px 16px;background:#10192d;border-bottom:1px solid #35476a; flex-shrink: 0; display:flex; justify-content:space-between; align-items:center;}
h1{font-size:18px;margin:0;color:#fff}

main{padding:10px; width:100%; flex: 1; display: flex; flex-direction: column; overflow: hidden;}

.timeline-box{border:1px solid #30415f;border-radius:8px;background:#0e1728; flex: 1; display: flex; flex-direction: column; min-height: 0;}
.timeline-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#182744;border-bottom:1px solid #2d3b59;font-size:11px; flex-shrink: 0;}
.scroll-controls{display:flex;gap:4px}
.scroll-btn{cursor:pointer;padding:3px 10px;font-size:11px;border:1px solid #354462;border-radius:4px;background:#151f34;color:var(--text);}
.scroll-btn:hover{background:#233352}

.scroll{overflow-x:auto;overflow-y:auto;flex:1;scrollbar-color:#607ba7 #182238;scroll-behavior:smooth; position: relative;}
.board{position:relative;padding:0 20px 20px; min-height: 100%;}
.axis{height:30px;position:sticky;top:0;z-index:8;background:#0e1728;border-bottom:1px solid #526482;}
.tick{position:absolute;bottom:0;height:8px;border-left:1px solid #526482;padding-left:3px;font-size:10px;color:#c0d0eb}
.tick span{position:absolute;bottom:8px;left:2px;font-weight:700;}

.event-area{position:relative;min-height:550px;background:repeating-linear-gradient(90deg,transparent 0,transparent 499px,#ffffff05 500px)}
.event-card{position:absolute;width:220px;padding:6px 8px;border:1px solid #4a5f80;border-left:4px solid var(--accent);border-radius:5px;background:#131e32;color:#f2f6ff;cursor:pointer;line-height:1.2; font-size: 11px; transition: filter .15s, border-color .15s; user-select: none;}
.event-card:hover{border-color:#fff;filter:brightness(1.2);z-index:5}
.event-card .date{display:block;font-size:10px;font-weight:800;color:#c3d7f7;margin-bottom:2px; pointer-events: none;}
.event-card .event-title{display:block;font-size:11px;font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;}

/* Modal Overlay */
.overlay{position:fixed;inset:0;background:rgba(2, 6, 18, 0.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{width:min(500px,100%);max-height:85vh;overflow:auto;background:linear-gradient(145deg,#1b2942,#121b2e);border:1px solid #405578;border-radius:10px;padding:16px;box-shadow:0 20px 60px #0008}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.modal h3{margin:4px 0 10px;font-size:17px;line-height:1.2;color:#fff}
