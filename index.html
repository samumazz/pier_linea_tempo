<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronologia Storica</title>
<style>
:root{color-scheme:dark;--bg:#0a1020;--text:#eef4ff;--muted:#b8c7e1;--green:#7cb342;--purple:#ab47bc;--brown:#8d6e63;--blue:#42a5f5;--red:#ef5350}
*{box-sizing:border-box}
html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; font: 13px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); display: flex; flex-direction: column; }

header{padding:10px 16px;background:#10192d;border-bottom:1px solid #35476a; flex-shrink: 0; display:flex; justify-position:space-between; align-items:center;}
h1{font-size:18px;margin:0;color:#fff}

main{padding:10px; width:100%; flex: 1; display: flex; flex-direction: column; overflow: hidden;}

.timeline-box{border:1px solid #30415f;border-radius:8px;background:#0e1728; flex: 1; display: flex; flex-direction: column; min-height: 0;}
.timeline-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#182744;border-bottom:1px solid #2d3b59;font-size:11px; flex-shrink: 0;}
.scroll-controls{display:flex;gap:4px}
.scroll-btn{cursor:pointer;padding:3px 10px;font-size:11px;border:1px solid #354462;border-radius:4px;background:#151f34;color:var(--text);}
.scroll-btn:hover{background:#233352}

.scroll{overflow-x:auto;overflow-y:auto;flex:1;scrollbar-color:#607ba7 #182238;scroll-behavior:smooth; position: relative;}
.board{position:relative;padding:0 20px 20px; min-height: 100%;}
.axis{height:30px;position:sticky;top:0;z-index:8;background:#0e1728;border-bottom:1px solid #526482;}
.tick{position:absolute;bottom:0;height:8px;border-left:1px solid #526482;padding-left:3px;font-size:10px;color:#c0d0eb}
.tick span{position:absolute;bottom:8px;left:2px;font-weight:700;}

.event-area{position:relative;min-height:550px;background:repeating-linear-gradient(90deg,transparent 0,transparent 499px,#ffffff05 500px)}
.event-card{position:absolute;width:220px;padding:6px 8px;border:1px solid #4a5f80;border-left:4px solid var(--accent);border-radius:5px;background:#131e32;color:#f2f6ff;line-height:1.2; font-size: 11px;}
.event-card .date{display:block;font-size:10px;font-weight:800;color:#c3d7f7;margin-bottom:2px}
.event-card .event-title{display:block;font-size:11px;font-weight:700;}
</style></head><body>

<header><h1>Cronologia Storica (1517 - 1648)</h1></header>
<main>
<div class="timeline-box">
  <div class="timeline-top">
    <span>Scorri orizzontalmente per esplorare le date</span>
    <div class="scroll-controls">
      <button class="scroll-btn" id="scrollLeft">◀ Sinistra</button>
      <button class="scroll-btn" id="scrollRight">Destra ▶</button>
    </div>
  </div>
  <div class="scroll" id="scroll">
    <div class="board" id="board">
      <div class="axis" id="axis"></div>
      <div class="event-area" id="eventArea"></div>
    </div>
  </div>
</div>
</main>

<script>
// Dati presi esclusivamente dall'immagine fornita
const events = [
  // Categoria Verde
  [1517, 1521, "Riforma luterana", "green"],
  [1517, 1517, "1517-10-31 Martin Lutero affigge le 95 tesi", "green"],
  [1519, 1556, "Impero di Carlo V", "green"],
  [1555, 1555, "Pace di Augusta", "green"],
  [1555, 1618, "Epoca della confessionalizzazione e tensioni nell'Impero", "green"],
  [1618, 1648, "Guerra dei Trent'anni", "green"],
  [1648, 1648, "Pace di Vestfalia", "green"],

  // Categoria Viola
  [1545, 1563, "Concilio di Trento e Controriforma", "purple"],

  // Categoria Marrone
  [1556, 1598, "Regno di Filippo II", "brown"],
  [1566, 1581, "Rivolta dei Paesi Bassi", "brown"],
  [1571, 1571, "1571-10-07 Battaglia di Lepanto", "brown"],

  // Categoria Blu
  [1534, 1534, "Atto di Supremazia di Enrico VIII", "blue"],
  [1534, 1558, "Fase della Riforma e regno dei Tudor", "blue"],
  [1558, 1603, "Epoca elisabettiana", "blue"],
  [1588, 1588, "Sconfitta dell'Invincibile Armata", "blue"],

  // Categoria Rossa
  [1562, 1598, "Guerre di religione in Francia", "red"],
  [1572, 1572, "Strage di san Bartolomeo", "red"],
  [1598, 1598, "Editto di Nantes", "red"],
  [1598, 1610, "Regno di Enrico IV", "red"],
  [1610, 1624, "Regno di Maria de' Medici e successivamente di Luigi XIII", "red"],
  [1624, 1642, "Governo di Richelieu e assolutismo", "red"]
];

const colors = {
  green: "var(--green)",
  purple: "var(--purple)",
  brown: "var(--brown)",
  blue: "var(--blue)",
  red: "var(--red)"
};

const minYear = 1510;
const maxYear = 1660;
const scale = 25; // Pixel per anno per un layout ben distribuito

const board = document.getElementById('board');
const axis = document.getElementById('axis');
const eventArea = document.getElementById('eventArea');
const scrollContainer = document.getElementById('scroll');

function render() {
  const boardWidth = (maxYear - minYear) * scale + 300;
  board.style.width = boardWidth + 'px';

  // Tacche degli anni (ogni 10 anni come nell'immagine)
  for(let y = minYear; y <= maxYear; y += 10) {
    const t = document.createElement('div');
    t.className = 'tick';
    t.style.left = ((y - minYear) * scale) + 'px';
    t.innerHTML = `<span>${y}</span>`;
    axis.append(t);
  }

  // Posizionamento delle schede a binari senza sovrapposizioni
  const cardW = 230;
  const cardH = 50;
  const trackEnd = [];

  events.sort((a, b) => a[0] - b[0] || a[1] - b[1]).forEach(e => {
    const x = (e[0] - minYear) * scale;
    let track = 0;

    while (track < trackEnd.length && trackEnd[track] > x - 10) {
      track++;
    }
    if (track === trackEnd.length) trackEnd.push(0);
    trackEnd[track] = x + cardW;

    const el = document.createElement('div');
    el.className = 'event-card';
    el.style.left = x + 'px';
    el.style.top = (10 + track * cardH) + 'px';
    el.style.setProperty('--accent', colors[e[3]]);
    
    const dateText = e[0] === e[1] ? `${e[0]}` : `${e[0]} / ${e[1]}`;
    el.innerHTML = `<span class="date">${dateText}</span><span class="event-title">${e[2]}</span>`;
    eventArea.append(el);
  });
  
  eventArea.style.height = (trackEnd.length * cardH + 40) + 'px';
}

document.getElementById('scrollLeft').addEventListener('click', () => scrollContainer.scrollBy({ left: -300, behavior: 'smooth' }));
document.getElementById('scrollRight').addEventListener('click', () => scrollContainer.scrollBy({ left: 300, behavior: 'smooth' }));

render();
</script></body></html>
